name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect backend scaffold
        id: backend
        run: |
          if [ -f backend/requirements.txt ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Backend scaffold not found yet. Skipping backend tests until backend/requirements.txt exists."
          fi

      - name: Set up Python
        if: steps.backend.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        if: steps.backend.outputs.exists == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend unit and integration tests
        if: steps.backend.outputs.exists == 'true'
        working-directory: backend
        run: pytest -q

  mobile-tests:
    name: Mobile Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect mobile scaffold
        id: mobile
        run: |
          if [ -f mobile/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Mobile scaffold not found yet. Skipping mobile tests until mobile/package.json exists."
          fi

      - name: Set up Node.js
        if: steps.mobile.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        if: steps.mobile.outputs.exists == 'true'
        working-directory: mobile
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run TypeScript check
        if: steps.mobile.outputs.exists == 'true'
        working-directory: mobile
        run: npm run typecheck

      - name: Run mobile unit and integration tests
        if: steps.mobile.outputs.exists == 'true'
        working-directory: mobile
        run: npm test -- --watchAll=false
